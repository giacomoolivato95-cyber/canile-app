<!DOCTYPE html>
<html>
<head>
  <!--
    ============================================================
    METADATI BASE
    ============================================================
  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
 

  <!--
    ============================================================
    TITOLO E DESCRIZIONE
    ============================================================
  -->
  <title>Canile App</title>
  <meta name="description" content="App per la gestione del canile">

  <!--
    ============================================================
    🔥 CONTROLLO CACHE (FORZA IL REFRESH)
    ============================================================
    Questi meta tag dicono al browser di NON mettere in cache
    l'app e di ricaricare sempre l'ultima versione.
  -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!--
    ============================================================
    FAVICON E ICONE PER PWA
    ============================================================
  -->
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!--
    ============================================================
    MANIFEST PER PWA
    ============================================================
    Permette di installare l'app sulla home del telefono.
  -->
  <link rel="manifest" href="manifest.json">

  <!--
    ============================================================
    SCRIPT PRINCIPALE
    ============================================================
    Flutter caricherà l'app qui.
  -->
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('firebase-messaging-sw.js')
      .then(function(registration) {
        console.log('✅ Service Worker registrato:', registration);
      })
      .catch(function(error) {
        console.log('❌ Errore registrazione Service Worker:', error);
      });
  }
</script>
</head>
<body>
  <!-- Flutter rendererà l'app qui -->
</body>
</html>
